version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Grouped so a week's updates arrive as one reviewable PR rather than
    # fifteen. The toolchain groups are separated because a lint or build tool
    # bump is a different kind of risk from a runtime dependency bump.
    groups:
      runtime:
        patterns: ['*']
        exclude-patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vitest'
          - '@vitest/*'
          - 'turbo'
          - 'typescript'
      toolchain:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vitest'
          - '@vitest/*'
          - 'turbo'
          - 'typescript'
    ignore:
      # typescript-eslint's peer range caps TypeScript below 6.1, so a major bump
      # takes the type-aware lint rules offline and fails `lint` while the other
      # five checks stay green — see D4. Remove this once typescript-eslint
      # supports the next major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(repo)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
