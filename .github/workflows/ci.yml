name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Also runs the scheduling-core purity check, which fails on any
      # dependency, any async, or any non-deterministic call in that package.
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  db:
    name: db
    runs-on: ubuntu-latest
    # Verifies the claims of ADR 0001 against a real Postgres: the migration
    # applies, applies twice with no effect, and the two exclusion constraints
    # actually reject overlapping intervals with SQLSTATE 23P01. None of this can
    # be checked without a database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanflow
          POSTGRES_PASSWORD: scanflow
          POSTGRES_DB: scanflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanflow -d scanflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://scanflow:scanflow@localhost:5432/scanflow_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:verify

  test-integration:
    name: test:integration
    runs-on: ubuntu-latest
    # Testcontainers needs a Docker daemon; GitHub-hosted Ubuntu runners have one.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run integration tests
        run: pnpm test:integration
        env:
          # Ryuk can hang on some runners; the suite tears the container down itself.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  bench:
    name: bench
    runs-on: ubuntu-latest
    # The README states a p95 for the engine. A stated performance bound that
    # nothing enforces decays into a stale claim, so the benchmark exits non-zero
    # if p95 reaches the 50 ms budget. It measures the 95th percentile of 300
    # fixed-seed days per case, so an isolated slow moment on a shared runner
    # cannot fail the build -- only a real regression can.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
